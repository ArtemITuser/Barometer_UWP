name: Build UWP release (ARM32/ARM64)

on:
  push:
    tags:
      - 'v*'          # автоматический релиз при пуше тега (например v1.4.0.3-deploy)
  workflow_dispatch:  # ручной запуск с выбором конфигурации
    inputs:
      build_arm64:
        description: 'Также собрать ARM64'
        type: boolean
        default: false

permissions:
  contents: write     # нужно для создания GitHub Release и загрузки ассетов

env:
  NET_SDK: '8.0.x'    # dotnet нужен только для restore; саму сборку делает MSBuild из VS image

jobs:
  build-arm:
    name: Build Release|ARM
    runs-on: windows-latest   # образ Windows содержит VS 2022 + UWP-компоненты
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK (for restore)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.NET_SDK }}

      - name: Install UWP workload components (VS Installer)
        shell: powershell
        run: |
          $exe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $exe modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.Component.MSBuild `
            --add Microsoft.VisualStudio.Workload.UniversalBuildTools `
            --includeRecommended --quiet --wait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore signing certificate from secrets
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_PFX_BASE64)) {
            Write-Host "::warning::SIGNING_PFX_BASE64 secret is not set - package will be UNSIGNED (sideload on device will fail)"
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          [IO.File]::WriteAllBytes("$PWD\Barometer_UWP\Barometer_UWP_TemporaryKey.pfx", $bytes)
          Write-Host "Signing PFX restored ($( $bytes.Length ) bytes)"

      - name: NuGet restore (msbuild)
        run: msbuild Barometer_UWP\Barometer_UWP.csproj /t:Restore /p:Configuration=Release /p:Platform=ARM

      - name: Build Release|ARM (ARM32, Lumia 950 / Elite x3)
        shell: cmd
        run: msbuild Barometer_UWP\Barometer_UWP.csproj /p:Configuration=Release /p:Platform=ARM /p:AppxBundle=Always /p:AppxBundlePlatforms=\"ARM\" /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile=Barometer_UWP_TemporaryKey.pfx /p:PackageCertificatePassword=barometer-ci /v:m /nologo

      - name: Build Release|ARM64 (optional)
        if: ${{ inputs.build_arm64 }}
        shell: cmd
        run: msbuild Barometer_UWP\Barometer_UWP.csproj /p:Configuration=Release /p:Platform=ARM64 /p:AppxBundle=Always /p:AppxBundlePlatforms=\"ARM64\" /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile=Barometer_UWP_TemporaryKey.pfx /p:PackageCertificatePassword=barometer-ci /v:m /nologo

      - name: Export public signing certificate (for device trust install)
        shell: powershell
        run: |
          $pfx = "Barometer_UWP\Barometer_UWP_TemporaryKey.pfx"
          if (Test-Path $pfx) {
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, '${{ secrets.SIGNING_PFX_PASSWORD }}')
            [IO.File]::WriteAllBytes("artifacts_tmp_cert.cer", $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          }

      - name: Collect artifacts
        shell: powershell
        run: |
          mkdir artifacts
          Get-ChildItem -Recurse Barometer_UWP\AppPackages -Include *.appx,*.appxbundle,*.appxsym -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts
          if (Test-Path artifacts_tmp_cert.cer) { Copy-Item artifacts_tmp_cert.cer artifacts/ }
          Compress-Archive -Path Barometer_UWP -DestinationPath artifacts/Barometer_UWP-src.zip -Force

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true

      - name: Upload workflow artifacts (для workflow_dispatch)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: barometer-appx
          path: artifacts/
