name: Build UWP release (ARM32/ARM64)

on:
  push:
    tags:
      - 'v*'          # автоматический релиз при пуше тега v1.4.0.x
  workflow_dispatch:  # ручной запуск с выбором конфигурации
    inputs:
      build_arm64:
        description: 'Также собрать ARM64'
        type: boolean
        default: false

permissions:
  contents: write     # нужно для создания GitHub Release и загрузки ассетов

jobs:
  build-arm:
    name: Build Release|ARM
    runs-on: windows-2022   # VS2022 image; classic UWP toolchain verified here
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK 6.0 (classic UWP-compatible; newer SDKs break UWP 6.x metapackage resolution)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install UWP workload components (VS Installer)
        shell: powershell
        run: |
          $exe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $exe modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.Component.MSBuild `
            --add Microsoft.VisualStudio.Workload.UniversalBuildTools `
            --includeRecommended --quiet --wait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pin UAP targets to installed Windows SDK version
        shell: powershell
        run: |
          # Classic UWP csproj resolves WinRT projections + netcore reference assemblies via
          # $(TargetPlatformVersion). Runner images ship newer Kits only, so the 15254 facades
          # are absent -> every System.* / Windows.* type fails (CS0012/CS0234/CS0246).
          # We keep the manifest at 15254 (runtime contract) but compile against the newest
          # installed UAP surface, which is backward compatible down to MinVersion 15063.
          $umDir = "C:\Program Files (x86)\Windows Kits\10\UnionMetadata"
          if (-not (Test-Path $umDir)) { Write-Host "::error::Windows Kits UnionMetadata dir missing"; exit 1 }
          $ver = (Get-ChildItem $umDir -Directory | Where-Object Name -match '^10\.0\.\d+\.0$' | Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1).Name
          if (-not $ver) { Write-Host "::error::no UAP UnionMetadata found"; exit 1 }
          Write-Host "Compile-time UAP=$ver ; appxmanifest Target stays 10.0.15254.0"
          Add-Content -Path $env:GITHUB_ENV -Value "UAP_PINNED_VERSION=$ver"

      - name: Patch project for CI (override TargetPlatformMinVersion, MSBuild imports, signing)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $csproj = "Barometer_UWP\Barometer_UWP.csproj"
          $raw = Get-Content $csproj -Raw
          # 1) Override MinVersion with the pinned SDK too: nuget picks uap10.0.<min> target
          #    folder from it; packages.config has no assets for 15063 on this toolchain.
          $raw = $raw -replace '<TargetPlatformMinVersion>[^<]*</TargetPlatformMinVersion>', "<TargetPlatformMinVersion>${{ env.UAP_PINNED_VERSION }}</TargetPlatformMinVersion>"
          # 2) Fix Microsoft.Common.props import: hard-coded $(MSBuildToolsVersion) path does not
          #    exist under VS2022 layout -> UWP .winmd references silently drop (mass CS0234).
          $raw = $raw.Replace('$(MSBuildExtensionsPath)\$(MSBuildToolsVersion)\Microsoft.Common.props', '$(MSBuildExtensionsPath)\Microsoft\Common\Microsoft.Common.props')
          # 3) Disable package signing in CI (no private pfx key on runner).
          $raw = $raw -replace '</Project>\s*$', "  <PropertyGroup>`n    <AppxPackageSigningEnabled>False</AppxPackageSigningEnabled>`n  </PropertyGroup>`n</Project>`n"
          Set-Content $csproj $raw -Encoding UTF8
          Select-String -Path $csproj -Pattern 'TargetPlatformMinVersion|Common\.props|AppxPackageSigningEnabled' | ForEach-Object { $_.Line.Trim() }

      - name: NuGet restore packages.config (classic UWP toolchain)
        shell: powershell
        run: |
          # Root cause of WMC1006 'System.Runtime cannot be resolved': MSBuild /t:Restore
          # does NOT restore packages.config projects ("Nothing to do. None of the projects
          # specified contain packages to restore") -> metapackage Microsoft.NETCore.UniversalWindowsPlatform
          # never lands in ..\packages and the netcore/WinRT projections are missing at compile time.
          if (-not (Test-Path nuget.exe)) {
            Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/v6.4.0/nuget.exe -OutFile nuget.exe
          }
          ./nuget.exe restore Barometer_UWP\packages.config -SolutionDirectory . -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($p in @(
            "packages\Microsoft.NETCore.UniversalWindowsPlatform.6.0.8",
            "packages\Newtonsoft.Json.12.0.3",
            "packages\DocumentFormat.OpenXml.2.9.1")) {
            if (-not (Test-Path $p)) { Write-Host "::error::restore missing $p"; exit 1 }
          }
          Get-ChildItem packages\Microsoft.NETCore.UniversalWindowsPlatform.6.0.8 -Recurse -Filter *.winmd | Select-Object -First 3 FullName

      - name: Flatten UWP metapackage dependencies (nuget.exe CLI does not install transitive deps)
        shell: powershell
        run: |
          # v1.4.0.9: packages.config now contains the FULL flattened dependency closure of the
          # UWP metapackage (89 packages incl. System.Runtime facades, WinRT projections, .NET
          # Native toolchain), so nuget.exe CLI restore downloads everything directly. No need
          # for MSBuild-based sln restore (which silently skipped transitive resolution here).
          ./nuget.exe restore Barometer_UWP\packages.config -SolutionDirectory . -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # version-tolerant guards: facade may resolve to any 4.x depending on graph
          if (-not (Get-ChildItem packages -Directory -Filter "System.Runtime.*")) { Write-Host "::error::System.Runtime facade missing"; exit 1 }
          if (-not (Test-Path "packages\Microsoft.NETCore.UniversalWindowsPlatform.6.0.8")) { Write-Host "::error::UAP metapackage missing"; exit 1 }
          Write-Host ("package count after full restore: " + (Get-ChildItem packages -Directory).Count)

      - name: Generate obj\nuget.g.props/targets (packages.config wiring for MSBuild)
        shell: powershell
        run: |
          # Classic packages.config projects rely on VS writing obj\<proj>.nuget.g.props into the
          # csproj's obj folder; nuget.exe CLI restore does NOT do this for a bare packages.config
          # invocation. Without those imports the restored UWP metapackage (System.Runtime facades,
          # WinRT projections) is invisible to XamlCompiler/CSC -> WMC1006 + CS2001 cascade.
          # Emulate them manually against the restored packages folder.
          $ErrorActionPreference = "Stop"
          $projDir = "Barometer_UWP"
          $objDir  = Join-Path $projDir "obj"
          New-Item -ItemType Directory -Force -Path $objDir | Out-Null
          $pkgRoot = Join-Path (Get-Location).Path "packages"
          $solRoot = (Get-Location).Path
          # metapackage layout: lib\uap10.0 lives in the *transitive* Microsoft.NETCore.UWPLibraryPack,
          # not in the metapackage folder itself. Resolve System.Runtime.dll wherever it actually is.
          $rt = Get-ChildItem $pkgRoot -Recurse -Filter System.Runtime.dll |
                Where-Object { $_.FullName -match 'Microsoft\.NETCore\.UniversalWindowsPlatform' } |
                Select-Object -First 1
          if (-not $rt) { $rt = Get-ChildItem $pkgRoot -Recurse -Filter System.Runtime.dll | Select-Object -First 1 }
          if (-not $rt) { Write-Host "::error::System.Runtime.dll not found anywhere under packages\"; exit 1 }
          Write-Host "Using facade: $($rt.FullName)"
          # Build the props file line-by-line to avoid here-string/YAML indentation pitfalls.
          $lines = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<Project ToolsVersion="4.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">',
            '  <PropertyGroup>',
            "    <SolutionDir>$([System.IO.Path]::GetFullPath($solRoot))\</SolutionDir>",
            '    <NuGetProjectStyle>packages.config</NuGetProjectStyle>',
            '    <PackagesConfig>true</PackagesConfig>',
            "    <PackagesDir>$pkgRoot\</PackagesDir>",
            '  </PropertyGroup>',
            '  <ItemGroup>',
            '    <Reference Include="System.Runtime">',
            "      <HintPath>$($rt.FullName)</HintPath>",
            '    </Reference>',
            '  </ItemGroup>',
            '</Project>'
          )
          Set-Content (Join-Path $objDir "Barometer_UWP.nuget.g.props") $lines -Encoding UTF8
          Set-Content (Join-Path $objDir "Barometer_UWP.nuget.g.targets") @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<Project ToolsVersion="4.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">',
            '</Project>'
          ) -Encoding UTF8
          Get-Content (Join-Path $objDir "Barometer_UWP.nuget.g.props")

      - name: Build Release|ARM (ARM32, Lumia 950 / Elite x3)
        shell: cmd
        run: msbuild Barometer_UWP\Barometer_UWP.csproj /t:Build /p:Configuration=Release /p:Platform=ARM /p:AppxBundle=Always /p:UapAppxPackageBuildMode=SideloadOnly /p:TargetPlatformVersion=${{ env.UAP_PINNED_VERSION }} /p:AppxPackageSigningEnabled=false /bl:build-arm.binlog

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-arm
          path: |
            build-arm.binlog
            Barometer_UWP/obj/**/*.nuget.g.props
            Barometer_UWP/project.assets.json

      - name: Build Release|ARM64 (optional)
        if: ${{ inputs.build_arm64 }}
        shell: cmd
        run: msbuild Barometer_UWP\Barometer_UWP.csproj /t:Build /p:Configuration=Release /p:Platform=ARM64 /p:AppxBundle=Always /p:UapAppxPackageBuildMode=SideloadOnly /p:TargetPlatformVersion=${{ env.UAP_PINNED_VERSION }} /p:AppxPackageSigningEnabled=false

      - name: Collect artifacts
        run: |
          mkdir artifacts
          Get-ChildItem -Recurse Barometer_UWP\AppPackages -Include *.appx,*.appxbundle,*.appxsym | Copy-Item -Destination artifacts
          Compress-Archive -Path Barometer_UWP -DestinationPath artifacts/Barometer_UWP-src.zip -Force

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true

      - name: Upload workflow artifacts (для workflow_dispatch)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: barometer-appx
          path: artifacts/
