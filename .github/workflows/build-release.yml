name: Build UWP release (ARM32/ARM64)

on:
  push:
    tags:
      - 'v*'          # автоматический релиз при пуше тега v1.4.0.x
  workflow_dispatch:  # ручной запуск с выбором конфигурации
    inputs:
      build_arm64:
        description: 'Также собрать ARM64'
        type: boolean
        default: false

permissions:
  contents: write     # нужно для создания GitHub Release и загрузки ассетов

jobs:
  build-arm:
    name: Build Release|ARM
    runs-on: windows-2022   # VS2022 image; classic UWP toolchain verified here
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK 6.0 (classic UWP-compatible; newer SDKs break UWP 6.x metapackage resolution)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install UWP workload components (VS Installer)
        shell: powershell
        run: |
          $exe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $exe modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.Component.MSBuild `
            --add Microsoft.VisualStudio.Workload.UniversalBuildTools `
            --includeRecommended --quiet --wait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pin UAP targets to installed Windows SDK version
        shell: powershell
        run: |
          # Classic UWP csproj resolves WinRT projections + netcore reference assemblies via
          # $(TargetPlatformVersion). Runner images ship newer Kits only, so the 15254 facades
          # are absent -> every System.* / Windows.* type fails (CS0012/CS0234/CS0246).
          # We keep the manifest at 15254 (runtime contract) but compile against the newest
          # installed UAP surface, which is backward compatible down to MinVersion 15063.
          $umDir = "C:\Program Files (x86)\Windows Kits\10\UnionMetadata"
          if (-not (Test-Path $umDir)) { Write-Host "::error::Windows Kits UnionMetadata dir missing"; exit 1 }
          $ver = (Get-ChildItem $umDir -Directory | Where-Object Name -match '^10\.0\.\d+\.0$' | Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1).Name
          if (-not $ver) { Write-Host "::error::no UAP UnionMetadata found"; exit 1 }
          Write-Host "Compile-time UAP=$ver ; appxmanifest Target stays 10.0.15254.0"
          Add-Content -Path $env:GITHUB_ENV -Value "UAP_PINNED_VERSION=$ver"

      - name: Patch project for CI (override TargetPlatformMinVersion, MSBuild imports, signing)
        shell: powershell
        run: |
          $csproj = "Barometer_UWP\Barometer_UWP.csproj"
          $xml = [xml](Get-Content $csproj)
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.Name)
          $ns.AddNamespace("ms", "http://schemas.microsoft.com/developer/msbuild/2003")
          # 1) Override MinVersion with the pinned SDK too: nuget picks uap10.0.<min> target
          #    folder from it; packages.config has no assets for 15063 on this toolchain.
          $node = $xml.SelectSingleNode("//ms:PropertyGroup/ms:TargetPlatformMinVersion", $ns)
          $node.InnerText = "${{ env.UAP_PINNED_VERSION }}"
          # 2) Fix Microsoft.Common.props import: hard-coded $(MSBuildToolsVersion) path does not
          #    exist under VS2022 layout -> UWP .winmd references silently drop (mass CS0234).
          $imp = $xml.SelectSingleNode("//ms:Import[@Project*='Microsoft.Common.props']", $ns)
          if ($imp) { $imp.Project = "`$(MSBuildExtensionsPath)\Microsoft\Common\Microsoft.Common.props" }
          # 3) Disable package signing in CI (no private pfx key on runner).
          $pg = $xml.SelectSingleNode("//ms:PropertyGroup", $ns)
          $el = $xml.CreateElement("PropertyGroup", $xml.DocumentElement.NamespaceURI)
          $c1 = $xml.CreateElement("AppxPackageSigningEnabled", $xml.DocumentElement.NamespaceURI); $c1.InnerText = "False"
          $c2 = $xml.CreateElement("PackageCertificateKeyFile", $xml.DocumentElement.NamespaceURI); $c2.InnerText = ""
          $el.AppendChild($c1); $el.AppendChild($c2); $xml.DocumentElement.AppendChild($el)
          $xml.Save($csproj)
          Get-Content $csproj | Select-Object -First 25

      - name: Restore + Build Release|ARM (ARM32, Lumia 950 / Elite x3)
        run: msbuild Barometer_UWP\Barometer_UWP.csproj /t:Restore;Build /p:Configuration=Release /p:Platform=ARM /p:AppxBundle=Always /p:UapAppxPackageBuildMode=SideloadOnly /p:TargetPlatformVersion=${{ env.UAP_PINNED_VERSION }} /p:AppxPackageSigningEnabled=false /bl:build-arm.binlog

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-arm
          path: |
            build-arm.binlog
            Barometer_UWP/obj/**/*.nuget.g.props
            Barometer_UWP/project.assets.json

      - name: Build Release|ARM64 (optional)
        if: ${{ inputs.build_arm64 }}
        run: msbuild Barometer_UWP\Barometer_UWP.csproj /t:Restore;Build /p:Configuration=Release /p:Platform=ARM64 /p:AppxBundle=Always /p:UapAppxPackageBuildMode=SideloadOnly /p:TargetPlatformVersion=${{ env.UAP_PINNED_VERSION }} /p:AppxPackageSigningEnabled=false

      - name: Collect artifacts
        run: |
          mkdir artifacts
          Get-ChildItem -Recurse Barometer_UWP\AppPackages -Include *.appx,*.appxbundle,*.appxsym | Copy-Item -Destination artifacts
          Compress-Archive -Path Barometer_UWP -DestinationPath artifacts/Barometer_UWP-src.zip -Force

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true

      - name: Upload workflow artifacts (для workflow_dispatch)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: barometer-appx
          path: artifacts/
